<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Manage Products | EuroSpec</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet"
    />

</head>
<body>
    <header class="home-header">
        <a href="index.html" class="logo"><h2>EuroSpec</h2></a>
        <nav>
            <ul>
                <li><a href="inventory.html">Inventory</a></li>
                <li><a href="brands.html">Brands</a></li>
                <li><a href="about.html">Heritage</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="icons">
            <button class="theme-toggle" aria-label="Toggle Theme">
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
            <button class="mobile-nav-toggle" aria-label="Toggle Navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="crud-container">
        <h1>Product Management</h1>
        <p><a href="index.html" style="color: var(--secondary-text); text-decoration: none;">&larr; Back to Home</a></p>

        <section class="crud-section">
            <h2>Add / Edit Product</h2>
            <input type="hidden" id="productId">
            <div class="form-group">
                <label for="brandID">Brand</label>
                <select id="brandID" class="select-brand" required>
                    <option value="">Select a brand</option>
                    <option value="1">Mercedes-Benz</option>
                    <option value="2">BMW</option>
                    <option value="3">Audi</option>
                    <option value="4">Porsche</option>
                </select>
            </div>
            <div class="form-group">
                <label for="model">Model</label>
                <input type="text" id="model" placeholder="Enter model name (e.g., M4 Competition)">
            </div>
            <div class="form-group">
                <label for="year">Year</label>
                <input type="number" id="year" placeholder="Enter model year (e.g., 2023)">
            </div>
            <div class="form-group">
                <label for="price">Price (&euro;)</label>
                <input type="number" id="price" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="image_path">Image</label>
                <input type="text" id="image_path" placeholder="Enter image path (url)">
            </div>
            <div class="form-group">
                <label for="mileage">Mileage (km)</label>
                <input type="number" id="mileage" placeholder="Enter mileage">
            </div>
            <div class="form-group">
                <label for="top_speed">Top Speed (mph)</label>
                <input type="text" id="top_speed" placeholder="Enter top speed">
            </div>
            <div class="form-group">
                <label for="engine">Engine</label>
                <input type="text" id="engine" placeholder="Enter engine type (e.g., 3.0L Twin-Turbo I6)">
            </div>
            <div class="form-group">
                <label for="power">Power (hp and torque)</label>
                <input type="text" id="power" placeholder="Enter power">
            </div>
            <div class="form-group">
                <label for="transmission">Transmission</label>
                <input type="text" id="transmission" placeholder="Enter transmission type (e.g., 8-speed automatic)">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" placeholder="Enter product description">
            </div>
            <div class="button-group">
                <button id="opslaanKnop" class="btn-primary">Save Product</button>
                <button id="annuleerKnop" class="btn-secondary">Cancel</button>
            </div>
        </section>

        <section class="crud-section">
            <h2>All Products</h2>
            <ul id="carList"></ul>
        </section>
    </main>

    <footer>
        <div class="footer-logo">
            <h2>EuroSpec</h2>
        </div>
        <div class="footer-center">
            <p>&copy; 2026 EuroSpec. Precision Engineering. Architectural Minimalism.</p>
        </div>
        <div class="footer-links">
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="careers.html">Career</a>
            <a href="press.html">Press</a>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/crud.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialise theme
            if (typeof initTheme === 'function') initTheme();

            // Initialise mobile nav
            if (typeof initMobileNav === 'function') initMobileNav();

            // Bind buttons
            document.getElementById("opslaanKnop").addEventListener("click", productOpslaan);
            document.getElementById("annuleerKnop").addEventListener("click", formulierLeegmaken);

            // Load list
            toonBeheerLijst();
        });
    </script>
</body>
</html>
